services:
  ai-api-service:
    build: ./app-server
    container_name: ai-inference-api
    ports:
      - "5000:5000"
      - "8000:8000"
    networks:
      - sre-network
    restart: unless-stopped
    

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: sre-prometheus
    volumes:
      - ./monitoring-config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - sre-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: sre-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sresecretadmin
    networks:
      - sre-network
    restart: unless-stopped

networks:
  sre-network:
    driver: bridge